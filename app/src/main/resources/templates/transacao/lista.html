<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(titulo='Extrato', content=~{::section})}">
<body>
<section>
    <div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
        <div>
            <h1 class="text-xl font-semibold text-slate-900" th:text="'Extrato - ' + ${conta.descricao}"></h1>
            <p class="mt-1 text-sm text-slate-600" th:text="'Conta: ' + ${conta.numero}"></p>
        </div>
        <a th:href="@{/contas/{id}/transacoes/novo(id=${conta.id})}"
           class="inline-flex items-center justify-center border border-slate-500 bg-slate-100 px-3 py-2 text-sm text-slate-800 hover:bg-slate-200">
            Nova transação
        </a>
    </div>

    <div class="border border-slate-400 bg-slate-50">
        <div class="overflow-x-auto">
            <table class="w-full min-w-[720px] border-collapse text-left text-sm">
            <thead class="bg-slate-200 text-xs uppercase text-slate-700">
                <tr>
                    <th class="border border-slate-400 px-3 py-2 font-semibold">Data</th>
                    <th class="border border-slate-400 px-3 py-2 font-semibold">Descrição</th>
                    <th class="border border-slate-400 px-3 py-2 font-semibold">Categoria</th>
                    <th class="border border-slate-400 px-3 py-2 font-semibold">Tipo</th>
                    <th class="border border-slate-400 px-3 py-2 text-right font-semibold">Valor</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="t : ${transacoes}"
                    class="cursor-pointer hover:bg-slate-100"
                    tabindex="0"
                    role="link"
                    th:onclick="|window.location.href='@{/transacoes/{id}/editar(id=${t.id})}'|"
                    th:onkeydown="|if (event.key === 'Enter') window.location.href='@{/transacoes/{id}/editar(id=${t.id})}'|">
                    <td class="whitespace-nowrap border border-slate-300 px-3 py-2 text-slate-700" th:text="${#temporals.format(t.data, 'dd/MM/yyyy')}"></td>
                    <td class="border border-slate-300 px-3 py-2 text-slate-900" th:text="${t.descricao}"></td>
                    <td class="border border-slate-300 px-3 py-2 text-slate-700" th:text="${t.categoria.nome}"></td>
                    <td class="border border-slate-300 px-3 py-2 text-slate-700"
                        th:text="${t.movimento.name() == 'CREDITO'} ? 'Entrada' : 'Saída'"></td>
                    <td class="whitespace-nowrap border border-slate-300 px-3 py-2 text-right"
                        th:text="${t.movimento.name() == 'CREDITO' ? '+ ' : '- '} + ${#numbers.formatCurrency(t.valor)}"></td>
                </tr>
                <tr th:if="${transacoes.isEmpty()}">
                    <td colspan="5" class="border border-slate-300 px-3 py-6 text-center text-slate-500">Nenhuma transação registrada.</td>
                </tr>
            </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
