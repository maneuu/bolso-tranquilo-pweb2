<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(titulo=${transacao.id == null ? 'Nova transação' : 'Editar transação'}, content=~{::section})}">
<body>
<section class="max-w-lg">
    <h1 class="text-2xl font-semibold mb-6"
        th:text="${transacao.id == null} ? 'Nova transação' : 'Editar transação'"></h1>

    <form th:action="${transacao.id == null} ? @{/contas/{id}/transacoes(id=${contaId})} : @{/transacoes/{id}(id=${transacao.id})}"
          th:object="${transacao}" method="post"
          class="bg-white rounded-lg border border-slate-200 p-6 space-y-4">

        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Data</label>
            <input type="date" th:field="*{data}"
                   class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400">
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Descrição</label>
            <input type="text" th:field="*{descricao}"
                   class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400">
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Valor</label>
            <input type="number" step="0.01" min="0" th:field="*{valor}"
                   class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400">
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Movimento</label>
            <select th:field="*{movimento}"
                    class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400">
                <option th:each="m : ${movimentos}" th:value="${m}" th:text="${m}"></option>
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Categoria</label>
            <select name="categoriaId"
                    class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400">
                <option th:each="cat : ${categorias}"
                        th:value="${cat.id}"
                        th:selected="${transacao.categoria != null and transacao.categoria.id == cat.id}"
                        th:text="${cat.nome} + ' (' + ${cat.natureza} + ')'"></option>
            </select>
        </div>

        <div class="flex gap-3 pt-2">
            <button type="submit" class="rounded-md bg-slate-900 text-white text-sm px-4 py-2 hover:bg-slate-700">Salvar</button>
            <a th:href="@{/contas/{id}/transacoes(id=${contaId})}" class="rounded-md border border-slate-300 text-sm px-4 py-2 hover:bg-slate-50">Cancelar</a>
        </div>
    </form>

    <!-- UC05/UC06 -->
    <div th:if="${transacao.id != null}" class="mt-8 bg-white rounded-lg border border-slate-200 p-6">
        <h2 class="text-lg font-medium mb-3">Comentário</h2>

        <form th:if="${comentario == null}"
              th:action="@{/transacoes/{id}/comentario(id=${transacao.id})}" method="post" class="space-y-3">
            <textarea name="texto" rows="3" placeholder="Adicionar um comentário..."
                      class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400"></textarea>
            <button type="submit" class="rounded-md bg-slate-900 text-white text-sm px-4 py-2 hover:bg-slate-700">Adicionar comentário</button>
        </form>

        <div th:if="${comentario != null}" class="space-y-3">
            <form th:action="@{/comentarios/{id}/editar(id=${comentario.id})}" method="post" class="space-y-3">
                <textarea name="texto" rows="3" th:text="${comentario.texto}"
                          class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400"></textarea>
                <button type="submit" class="rounded-md bg-slate-900 text-white text-sm px-4 py-2 hover:bg-slate-700">Salvar comentário</button>
            </form>
            <form th:action="@{/comentarios/{id}/excluir(id=${comentario.id})}" method="post">
                <button type="submit" class="text-sm text-red-600 hover:underline">Excluir comentário</button>
            </form>
        </div>
    </div>
</section>
</body>
</html>
