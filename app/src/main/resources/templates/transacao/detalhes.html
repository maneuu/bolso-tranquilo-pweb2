<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(titulo='Consultar transação', content=~{::section})}">
<body>
<section class="max-w-lg">
    <div class="mb-6 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <div>
            <h1 class="text-2xl font-semibold">Consultar transação</h1>
            <p class="mt-1 text-sm text-slate-600" th:text="'Conta: ' + ${transacao.conta.descricao}"></p>
        </div>
        <a th:href="@{/transacoes/{id}/editar(id=${transacao.id})}"
           class="rounded-md bg-slate-900 px-4 py-2 text-center text-sm text-white hover:bg-slate-700">
            Editar transação
        </a>
    </div>

    <div class="space-y-4 border border-slate-400 bg-slate-50 p-6">
        <div>
            <span class="block text-sm font-medium text-slate-600">Data</span>
            <p class="mt-1 text-slate-900" th:text="${#temporals.format(transacao.data, 'dd/MM/yyyy')}"></p>
        </div>
        <div>
            <span class="block text-sm font-medium text-slate-600">Descrição</span>
            <p class="mt-1 text-slate-900" th:text="${transacao.descricao}"></p>
        </div>
        <div>
            <span class="block text-sm font-medium text-slate-600">Valor</span>
            <p class="mt-1 text-slate-900"
               th:text="${(transacao.movimento.name() == 'CREDITO' ? '+ ' : '- ') + #numbers.formatCurrency(transacao.valor)}"></p>
        </div>
        <div>
            <span class="block text-sm font-medium text-slate-600">Tipo</span>
            <p class="mt-1 text-slate-900"
               th:text="${transacao.movimento.name() == 'CREDITO' ? 'Entrada' : 'Saída'}"></p>
        </div>
        <div>
            <span class="block text-sm font-medium text-slate-600">Categoria</span>
            <p class="mt-1 text-slate-900" th:text="${transacao.categoria.nome}"></p>
        </div>
    </div>

    <div class="mt-6 border border-slate-400 bg-slate-50 p-6">
        <h2 class="text-lg font-medium">Comentário</h2>
        <p th:if="${comentarios.isEmpty()}" class="mt-2 text-sm text-slate-500">Nenhum comentário registrado.</p>
        <div th:each="comentario : ${comentarios}" class="mt-3 border-t border-slate-300 pt-3">
            <p class="whitespace-pre-wrap text-slate-900" th:text="${comentario.texto}"></p>
        </div>
    </div>

    <div class="mt-6">
        <a th:href="@{/contas/{id}/transacoes(id=${transacao.conta.id})}"
           class="rounded-md border border-slate-300 px-4 py-2 text-sm hover:bg-slate-50">
            Voltar ao extrato
        </a>
    </div>
</section>
</body>
</html>
