<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(titulo='Nova conta', content=~{::section})}">
<body>
<section class="max-w-lg">
    <h1 class="text-2xl font-semibold mb-6">Nova conta</h1>

    <form th:action="@{/correntistas/{id}/contas(id=${correntistaId})}" th:object="${conta}" method="post"
          class="bg-slate-50 border border-slate-400 p-6 space-y-4">

        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Número</label>
            <input type="text" th:field="*{numero}"
                   class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400">
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Descrição</label>
            <input type="text" th:field="*{descricao}"
                   class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400">
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Tipo</label>
            <select th:field="*{tipo}" id="tipo" onchange="toggleDiaFechamento()"
                    class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400">
                <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option>
            </select>
        </div>

        <div id="campoDiaFechamento">
            <label class="block text-sm font-medium text-slate-700 mb-1">Dia de fechamento</label>
            <input type="number" min="1" max="31" th:field="*{diaFechamento}"
                   class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400">
        </div>

        <div class="flex gap-3 pt-2">
            <button type="submit" class="inline-flex items-center gap-2 rounded-md bg-slate-900 text-white text-sm px-4 py-2 hover:bg-slate-700">
                <i data-lucide="save" class="h-4 w-4" aria-hidden="true"></i>
                Salvar
            </button>
            <a th:href="@{/correntistas/{id}/contas(id=${correntistaId})}" class="inline-flex items-center gap-2 rounded-md border border-slate-300 text-sm px-4 py-2 hover:bg-slate-50">
                <i data-lucide="x" class="h-4 w-4" aria-hidden="true"></i>
                Cancelar
            </a>
        </div>
    </form>
</section>

<script>
    function toggleDiaFechamento() {
        const tipo = document.getElementById('tipo').value;
        const campo = document.getElementById('campoDiaFechamento');
        const input = campo.querySelector('input');
        const habilitado = tipo === 'CARTAO';
        campo.style.display = (tipo === 'CARTAO') ? 'block' : 'none';
        input.disabled = !habilitado;
        if (!habilitado) {
            input.value = '';
        }
    }
    document.addEventListener('DOMContentLoaded', toggleDiaFechamento);
</script>
</body>
</html>
