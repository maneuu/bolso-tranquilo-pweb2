<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(titulo='Novo correntista', content=~{::section})}">
<body>
<section class="max-w-lg">
    <h1 class="text-2xl font-semibold mb-6">Novo correntista</h1>

    <form th:action="@{/correntistas}" th:object="${correntista}" method="post"
          class="bg-slate-50 border border-slate-400 p-6 space-y-4">

        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Nome</label>
            <input type="text" th:field="*{nome}"
                   class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400">
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Login</label>
            <input type="text" th:field="*{login}"
                   class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400">
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
            <input type="password" th:field="*{senha}"
                   class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400">
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Papel</label>
            <select th:field="*{papel}"
                    class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400">
                <option th:each="p : ${papeis}" th:value="${p}" th:text="${p}"></option>
            </select>
        </div>

        <div class="flex gap-3 pt-2">
            <button type="submit" class="inline-flex items-center gap-2 rounded-md bg-slate-900 text-white text-sm px-4 py-2 hover:bg-slate-700">
                <i data-lucide="save" class="h-4 w-4" aria-hidden="true"></i>
                Salvar
            </button>
            <a th:href="@{/correntistas}" class="inline-flex items-center gap-2 rounded-md border border-slate-300 text-sm px-4 py-2 hover:bg-slate-50">
                <i data-lucide="x" class="h-4 w-4" aria-hidden="true"></i>
                Cancelar
            </a>
        </div>
    </form>
</section>
</body>
</html>
