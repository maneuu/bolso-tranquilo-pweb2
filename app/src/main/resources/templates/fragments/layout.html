<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(titulo, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} ?: 'SpendWise'">SpendWise</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-200 text-slate-700 flex flex-col">

    <header class="border-b border-slate-950 bg-slate-800 text-slate-100">
        <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3">
            <a th:href="@{/}" class="font-semibold text-white">SpendWise</a>
            <nav class="flex items-center gap-4 text-sm text-slate-300">
                <a th:href="@{/}" class="hover:text-white hover:underline">Início</a>

                <a th:if="${sessaoAdmin}" th:href="@{/correntistas}" class="hover:text-white hover:underline">Correntistas</a>
                <a th:if="${sessaoLogada and !sessaoAdmin}"
                   th:href="@{/correntistas/{id}/contas(id=${sessaoCorrentistaId})}"
                   class="hover:text-white hover:underline">Minhas contas</a>

                <span th:if="${sessaoLogada}" class="border-l border-slate-600 pl-4 text-slate-300" th:text="${sessaoNome}"></span>

                <form th:if="${sessaoLogada}" th:action="@{/logout}" method="post" class="inline">
                    <button type="submit" class="text-slate-300 hover:text-white hover:underline">Sair</button>
                </form>

                <a th:unless="${sessaoLogada}" th:href="@{/login}" class="hover:text-white hover:underline">Entrar</a>
            </nav>
        </div>
    </header>

    <main class="mx-auto w-full max-w-6xl flex-1 border-x border-slate-300 bg-slate-100 px-4 py-8">

        <div th:if="${sucesso}" class="mb-5 border-l-4 border-emerald-600 bg-emerald-50 px-4 py-3 text-sm text-emerald-800" th:text="${sucesso}"></div>
        <div th:if="${erro}" class="mb-5 border-l-4 border-red-600 bg-red-50 px-4 py-3 text-sm text-red-800" th:text="${erro}"></div>

        <div th:replace="${content}"></div>
    </main>

    <footer class="border-t border-slate-400 bg-slate-200 py-4 text-center text-xs text-slate-500">
        SpendWise &mdash; Etapa 1
    </footer>

</body>
</html>
