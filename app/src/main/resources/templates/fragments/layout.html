<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(titulo, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} ?: 'BolsoTranquilo'">BolsoTranquilo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        .rounded-md,
        .rounded-lg,
        .rounded-xl,
        .rounded-2xl {
            border-radius: 0 !important;
        }

        button.bg-slate-900,
        a.bg-slate-900 {
            background-color: #2f4f6f !important;
        }

        button.bg-slate-900:hover,
        a.bg-slate-900:hover {
            background-color: #1f3a55 !important;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-300 text-slate-700 flex flex-col">

    <header class="border-b border-slate-950 bg-[#2f4f6f] text-slate-100">
        <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3">
            <a th:href="@{/}" class="inline-flex items-center gap-2 font-semibold text-white">
                <i data-lucide="wallet-cards" class="h-5 w-5" aria-hidden="true"></i>
                BolsoTranquilo
            </a>
            <nav class="flex items-center gap-4 text-sm text-slate-300">
                <a th:href="@{/}" class="inline-flex items-center gap-1 hover:text-white hover:underline">
                    <i data-lucide="house" class="h-4 w-4" aria-hidden="true"></i>
                    Início
                </a>

                <a th:if="${sessaoAdmin}" th:href="@{/correntistas}" class="inline-flex items-center gap-1 hover:text-white hover:underline">
                    <i data-lucide="users" class="h-4 w-4" aria-hidden="true"></i>
                    Correntistas
                </a>
                <a th:if="${sessaoLogada and !sessaoAdmin}"
                   th:href="@{/correntistas/{id}/contas(id=${sessaoCorrentistaId})}"
                   class="inline-flex items-center gap-1 hover:text-white hover:underline">
                    <i data-lucide="wallet" class="h-4 w-4" aria-hidden="true"></i>
                    Minhas contas
                </a>

                <span th:if="${sessaoLogada}" class="border-l border-slate-600 pl-4 text-slate-300" th:text="${sessaoNome}"></span>

                <form th:if="${sessaoLogada}" th:action="@{/logout}" method="post" class="inline">
                    <button type="submit" class="inline-flex items-center gap-1 text-slate-300 hover:text-white hover:underline">
                        <i data-lucide="log-out" class="h-4 w-4" aria-hidden="true"></i>
                        Sair
                    </button>
                </form>

                <a th:unless="${sessaoLogada}" th:href="@{/login}" class="inline-flex items-center gap-1 hover:text-white hover:underline">
                    <i data-lucide="log-in" class="h-4 w-4" aria-hidden="true"></i>
                    Entrar
                </a>
            </nav>
        </div>
    </header>

    <main class="mx-auto w-full max-w-6xl flex-1 border-x border-slate-400 bg-slate-100 px-4 py-8">

        <div th:if="${sucesso}" class="mb-5 border-l-4 border-emerald-600 bg-emerald-50 px-4 py-3 text-sm text-emerald-800" th:text="${sucesso}"></div>
        <div th:if="${erro}" class="mb-5 border-l-4 border-red-600 bg-red-50 px-4 py-3 text-sm text-red-800" th:text="${erro}"></div>

        <div th:replace="${content}"></div>
    </main>

    <footer class="border-t border-slate-500 bg-slate-300 py-4 text-center text-xs text-slate-600">
        BolsoTranquilo &mdash; Etapa 1
    </footer>

    <script>lucide.createIcons();</script>
</body>
</html>
