<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(titulo='Início', content=~{::section})}">
<body>
<section class="space-y-6">
    <div class="border-b border-slate-200 pb-5">
        <p class="text-sm text-slate-500">Área administrativa</p>
        <h1 class="mt-1 text-2xl font-semibold text-slate-900">Início</h1>
        <p class="mt-2 text-sm text-slate-600">Acesse rapidamente os cadastros e as contas do sistema.</p>
    </div>

    <div class="divide-y divide-slate-300 border-y border-slate-400 bg-slate-50">
        <a th:href="@{/correntistas}" class="flex items-center justify-between px-4 py-4 hover:bg-slate-50">
            <span>
                <span class="block font-medium text-slate-900">Correntistas</span>
                <span class="mt-1 block text-sm text-slate-500">Consultar usuários e acessar suas contas.</span>
            </span>
            <span class="inline-flex items-center gap-1 text-sm text-slate-500">
                Abrir <i data-lucide="arrow-right" class="h-4 w-4" aria-hidden="true"></i>
            </span>
        </a>
        <a th:href="@{/correntistas/novo}" class="flex items-center justify-between px-4 py-4 hover:bg-slate-50">
            <span>
                <span class="block font-medium text-slate-900">Novo correntista</span>
                <span class="mt-1 block text-sm text-slate-500">Cadastrar um novo usuário no sistema.</span>
            </span>
            <span class="inline-flex items-center gap-1 text-sm text-slate-500">
                Cadastrar <i data-lucide="arrow-right" class="h-4 w-4" aria-hidden="true"></i>
            </span>
        </a>
    </div>
</section>
</body>
</html>
