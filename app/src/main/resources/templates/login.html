<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(titulo='Entrar', content=~{::section})}">
<body>
<section class="max-w-sm mx-auto mt-16">
    <h1 class="text-2xl font-semibold mb-6 text-center">Entrar no BolsoTranquilo</h1>

    <form th:action="@{/login}" method="post" class="bg-slate-50 border border-slate-400 p-6 space-y-4">
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Login</label>
            <input type="text" name="login" required autofocus
                   class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
            <input type="password" name="senha" required
                   class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400">
        </div>
        <button type="submit" class="w-full rounded-md bg-slate-900 text-white text-sm px-4 py-2 hover:bg-slate-700">
            Entrar
        </button>
    </form>
</section>
</body>
</html>
